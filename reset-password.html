<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Восстановление пароля — Luxor Capital</title>

<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* AUTH PAGE */

.auth-page{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:40px 20px;
}

/* CARD */

.auth-card{
width:100%;
max-width:420px;
background:#050505;
border:1px solid rgba(212,175,55,0.25);
border-radius:22px;
padding:40px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.7);
}

/* LOGO */

.auth-logo{
margin-bottom:20px;
}

.auth-logo img{
height:70px;
}

/* TITLE */

.auth-card h2{
font-size:32px;
margin-bottom:10px;

background: linear-gradient(135deg,#f5d37b,#c9a23f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.auth-sub{
font-size:14px;
color:#999;
margin-bottom:30px;
}

/* INPUT */

.auth-card input{
width:100%;
padding:14px;
margin-bottom:20px;

background:#000;
border:1px solid rgba(255,255,255,0.1);
border-radius:12px;

color:#fff;
font-size:14px;
}

.auth-card input:focus{
border-color:#d4af37;
outline:none;
}

/* BUTTON */

.auth-btn{
width:100%;
padding:14px;
font-size:15px;
}

/* LINKS */

.auth-links{
margin-top:20px;
display:flex;
flex-direction:column;
gap:10px;
font-size:13px;
color:#999;
}

.auth-links a{
color:#d4af37;
text-decoration:none;
}

.auth-links a:hover{
text-decoration:underline;
}

</style>

</head>
<body>

<section class="auth-page">

<div class="auth-card">

<div class="auth-logo">
<img src="./img/logo.jpg" alt="Luxor Capital">
</div>

<h2>Восстановление пароля</h2>

<p class="auth-sub">
Введите email — мы отправим ссылку для восстановления.
</p>

<form>

<input type="email" placeholder="Email" required>

<button class="btn primary auth-btn">
Отправить ссылку
</button>

</form>

<div class="auth-links">

<span>
Вспомнили пароль?
<a href="login.html">Войти</a>
</span>

<span>
Нет аккаунта?
<a href="register.html">Создать</a>
</span>

</div>

</div>

</section>


</body>
</html>
