<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Восстановление пароля — Luxor Capital</title>

<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

.auth-page{
display:flex;
align-items:center;
justify-content:center;
min-height:80vh;
padding:40px 20px;
}

.auth-card{
width:100%;
max-width:420px;
background:#050505;
border:1px solid rgba(212,175,55,0.25);
border-radius:20px;
padding:40px;
box-shadow:0 20px 60px rgba(0,0,0,0.8);
}

.auth-card h2{
font-size:28px;
text-align:center;
margin-bottom:28px;

background:linear-gradient(135deg,#f5d37b,#c9a23f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.auth-input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.15);
background:#000;
color:#fff;
margin-bottom:16px;
font-size:14px;
}

.auth-input:focus{
outline:none;
border-color:#d4af37;
}

.auth-btn{
width:100%;
margin-top:10px;
}

.auth-links{
margin-top:20px;
font-size:13px;
text-align:center;
color:#aaa;
}

.auth-links a{
color:#d4af37;
text-decoration:none;
}

.auth-links a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<header class="header">
<div class="logo">
<img src="./img/logo.jpg" alt="Luxor Capital">
</div>

<nav class="nav">
<a href="index.html">Главная</a>
<a href="products.html">Продукты</a>
<a href="account.html">Аккаунт</a>
</nav>
</header>


<section class="auth-page">

<div class="auth-card">

<h2>Восстановление пароля</h2>

<input type="email" class="auth-input" placeholder="Введите email">

<button class="btn primary auth-btn">
Отправить ссылку восстановления
</button>

<div class="auth-links">
Вспомнили пароль? <a href="login.html">Войти</a>
</div>

</div>

</section>

</body>
</html>
